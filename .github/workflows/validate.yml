name: Validate tactics

# 任何分支 push / PR 都校验全部战术脚本（与 viewer 播放器同一套规则）
on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build index (validate all tactic scripts)
        run: node tools/build-index.js
